; ---------------------------------------------------------------------------
;  Doors.
;  The real layout of every ToLiSS type (A319, A320, A20N, A321, A21N, A339,
;  A346) is built in: passenger doors 1L/1R, 2L/2R ..., overwing exits, and the
;  FWD / AFT / BULK cargo doors. They are mapped onto these arrays in order
;  1L,1R,2L,2R,... and FWD,AFT,BULK. A dedicated bulk-door dataref is found by
;  name automatically. ToLiSS door modes: 0 = closed, 1 = auto, 2 = open.
; ---------------------------------------------------------------------------
[door_arrays]
pax          = AirbusFBW/PaxDoorModeArray
cargo        = AirbusFBW/CargoDoorModeArray
bulk         =
open_value   = 2
closed_value = 0

;  To override the layout for one type, write a [doors.<ICAO>] section:
;  Name = dataref[index], closed_value, open_value, position(0 nose..1 tail), side L/R, pax|cargo|bulk
; [doors.A21N]
; Door 1L = AirbusFBW/PaxDoorModeArray[0], 0, 2, 0.08, L, pax

; ---------------------------------------------------------------------------
;  Ground services.
;  Ground Power, Wheel Chocks, HP Air and LP Air are found AUTOMATICALLY: the
;  plugin lists every AirbusFBW/... dataref your aircraft publishes and picks the
;  best match by name. See and change the choice in Ground Ops > Customize, and
;  check values live in Settings > Diagnostics > Explorer.
;
;  Extra services (or a fixed choice for one of the above) can be added here:
;  Group|Name = dr:<dataref>[index], off_value, on_value
;  Group|Name = cmd:<toggle command>, off:<off command>, state:<state dataref>
; ---------------------------------------------------------------------------
[services]

; ---------------------------------------------------------------------------
;  Startup page (Ground Ops > Startup): the ISCS startup and aircraft-state buttons.
;  The plugin tries known command names, then clearly named writable datarefs.
;  Anything not found opens the ToLiSS ISCS instead. Set your own here
;  ([startup.A346] etc. for one type only):
;  eng1 / eng2 / apu / adiru / st_eng / st_apu / st_ext / st_cold = cmd:<command>  or  dr:<dataref>[index]
;  The plugin log lists the aircraft's datarefs named QUICK/COLD/SETSTATE.
; ---------------------------------------------------------------------------
[startup]
