; ---------------------------------------------------------------------------
;  ToLiSS EFB - dataref / command mapping
;
;  Every aircraft-specific name the tablet uses lives here, so you can fix or
;  extend it without recompiling. After editing, open the tablet's
;  Settings > Diagnostics page and press "Reload config": each entry shows
;  green (found in the sim) or red (not found).
;
;  Tip: DataRefTool (https://datareftool.com) lists every AirbusFBW/... dataref
;  and command your ToLiSS aircraft publishes - use it to confirm names.
;
;  Array elements are written  name[index].
;  A section can be specialised per aircraft by appending the ICAO code from
;  sim/aircraft/view/acf_ICAO, e.g. [doors.A21N] or [limits.A339].
; ---------------------------------------------------------------------------

[detect]
; The aircraft counts as a ToLiSS if ANY of these exists.
refs = AirbusFBW/NoPax, AirbusFBW/PaxDoorModeArray, AirbusFBW/ParkBrake

[loading]
; Names commonly used by community SimBrief-loader scripts for ToLiSS.
; Units are kilograms. The tablet writes the values, then fires apply_command.
pax                    = AirbusFBW/NoPax
pax_distribution       = AirbusFBW/PaxDistrib
pax_distribution_value = 0.5
fwd_cargo              = AirbusFBW/FwdCargo
aft_cargo              = AirbusFBW/AftCargo
fuel                   = AirbusFBW/WriteFOB
apply_command          = AirbusFBW/SetWeightAndCG
; Optional: a dataref giving the current CG in %MAC (leave empty if unknown).
cg_percent_mac         =

; ---------------------------------------------------------------------------
;  3D cockpit tablet. The EFB is drawn into the panel texture over the screen
;  you calibrate (Plugins > ToLiSS EFB > Calibrate cockpit tablet). These are
;  X-Plane's own datarefs for "where the mouse hits the panel texture".
; ---------------------------------------------------------------------------
[cockpit]
mouse_x           = sim/graphics/view/click_3d_x_pixels
mouse_y           = sim/graphics/view/click_3d_y_pixels
panel_render_type = sim/graphics/view/panel_render_type

; ---------------------------------------------------------------------------
;  Structural limits. Approximate figures for the planning bars only. A loaded
;  SimBrief OFP's MZFW/MLW take precedence. MTOW comes from the .acf itself.
; ---------------------------------------------------------------------------
[limits]
max_pax = 180
max_fwd_cargo_kg = 3400
max_aft_cargo_kg = 4500
mzfw_kg = 62500
mlw_kg = 66000

[limits.A319]
max_pax = 145
max_fwd_cargo_kg = 2600
max_aft_cargo_kg = 3700
mzfw_kg = 58500
mlw_kg = 62500

[limits.A20N]
max_pax = 180
max_fwd_cargo_kg = 3400
max_aft_cargo_kg = 4500
mzfw_kg = 64300
mlw_kg = 67400

[limits.A321]
max_pax = 220
max_fwd_cargo_kg = 5600
max_aft_cargo_kg = 7400
mzfw_kg = 71500
mlw_kg = 75500

[limits.A21N]
max_pax = 220
