; ToLiSS EFB - cockpit tablet calibrations shipped with the plugin.
; Each line maps an aircraft type (acf ICAO) to the tablet screen's corners in
; the panel texture:  ICAO = top-left x, top-left y, bottom-right x, bottom-right y
;
; Types not listed here are calibrated automatically the first time you load
; them with the cockpit tablet switched on (one press-and-scribble gesture), or
; borrow the calibration of a sibling (A319/A320/A321 share their cockpit).
; Settings > Cockpit > Export writes your own calibrations in this format.

